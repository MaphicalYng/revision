appId: com.maphicalyng.revision
productName: revision

# dist/ is the TypeScript output, so installer artifacts use a separate directory.
directories:
  buildResources: build
  output: release

asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - "dist/**"
  - "package.json"
  - "LICENSE"
  - "build/icon.png"
  - "!src/**"
  - "!plans/**"
  - "!scripts/**"
  - "!demo/**"
  - "!tests/**"

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
